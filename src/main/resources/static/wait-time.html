<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Restaurant B - Estimate Wait Time</title>
  <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'TH Sarabun New', sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      background: #fff;
      color: #333;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 8px;
      font-size: 20px;
    }
    select, input {
      font-size: 20px;
      font-family: 'TH Sarabun New', sans-serif;
    }
    input[type="number"] {
      width: 60px;
    }
    button {
      margin-top: 10px;
      padding: 6px 12px;
      font-size: 20px;
      font-family: 'TH Sarabun New', sans-serif;
      cursor: pointer;
    }
    #result {
      font-size: 22px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Restaurant B - Estimate Wait Time</h1>

  <form id="wait-form">
    <table id="order-table">
      <thead>
        <tr>
          <th>เมนูอาหาร</th>
          <th>จำนวน</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="order-body">
        <tr>
          <td>
            <select name="dish">
              <option value="กะเพราหมูสับไข่ดาว">กะเพราหมูสับไข่ดาว</option>
              <option value="หมูกรอบคั่วพริกเกลือ">หมูกรอบคั่วพริกเกลือ</option>
              <option value="ไก่ย่าง">ไก่ย่าง</option>
              <option value="ข้าวผัด">ข้าวผัด</option>
            </select>
          </td>
          <td><input type="number" min="1" value="1" name="quantity"></td>
          <td><button type="button" onclick="removeRow(this)">ลบ</button></td>
        </tr>
      </tbody>
    </table>
    <button type="button" onclick="addRow()">+ เพิ่มเมนู</button><br>
    <button type="submit">คำนวณเวลารออาหาร</button>
  </form>

  <p id="result"></p>

  <script>
    function addRow() {
      const tbody = document.getElementById("order-body");
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>
          <select name="dish">
            <option value="กะเพราหมูสับไข่ดาว">กะเพราหมูสับไข่ดาว</option>
            <option value="หมูกรอบคั่วพริกเกลือ">หมูกรอบคั่วพริกเกลือ</option>
            <option value="ไก่ย่าง">ไก่ย่าง</option>
            <option value="ข้าวผัด">ข้าวผัด</option>
          </select>
        </td>
        <td><input type="number" min="1" value="1" name="quantity"></td>
        <td><button type="button" onclick="removeRow(this)">ลบ</button></td>
      `;
      tbody.appendChild(row);
    }

    function removeRow(button) {
      const row = button.closest("tr");
      row.remove();
    }

    document.getElementById("wait-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const rows = document.querySelectorAll("#order-body tr");
      const order = [];

      rows.forEach(row => {
        const name = row.querySelector("select").value;
        const quantity = parseInt(row.querySelector("input").value);
        if (quantity > 0) {
          order.push({ name, quantity });
        }
      });

      fetch("/api/estimate-wait-time", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("result").innerText =
          "เวลารออาหารโดยประมาณ: " + data.waitTime + " นาที";
      });
    });
  </script>
</body>
</html>
